steps:
  # Build and push using kaniko — caches layers to GCS between builds.
  # This means npm ci and pip install are skipped when unchanged,
  # even on fresh Cloud Build VMs.
  - name: 'gcr.io/kaniko-project/executor:v1.23.0'
    args:
      - '--destination=gcr.io/$PROJECT_ID/orion-app-dev:latest'
      - '--cache=true'
      - '--cache-ttl=168h'
      - '--context=dir:///workspace'

  # Deploy to the DEV Cloud Run service.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'orion-app-dev'
      - '--image'
      - 'gcr.io/$PROJECT_ID/orion-app-dev:latest'
      - '--platform'
      - 'managed'
      - '--region'
      - 'europe-west1'
      - '--service-account'
      - '$PROJECT_NUMBER-compute@developer.gserviceaccount.com'
      - '--update-env-vars'
      - 'ORION_SERVICE_ACCOUNT=$PROJECT_NUMBER-compute@developer.gserviceaccount.com,ORION_VOS_BUCKET=$PROJECT_ID-orion-vos'
      - '--allow-unauthenticated'
