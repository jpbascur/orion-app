steps:
  # Build and push using kaniko — caches layers to GCS between builds.
  - name: 'gcr.io/kaniko-project/executor:v1.23.0'
    args:
      - '--destination=gcr.io/$PROJECT_ID/orion-app:latest'
      - '--cache=true'
      - '--cache-ttl=168h'
      - '--cache-repo=gcr.io/$PROJECT_ID/orion-app/cache'
      - '--context=dir:///workspace'

  # Deploy to Cloud Run.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'orion-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/orion-app:latest'
      - '--platform'
      - 'managed'
      - '--region'
      - 'europe-west1'
      - '--service-account'
      - '$PROJECT_NUMBER-compute@developer.gserviceaccount.com'
      - '--update-env-vars'
      - 'ORION_SERVICE_ACCOUNT=$PROJECT_NUMBER-compute@developer.gserviceaccount.com,ORION_VOS_BUCKET=$PROJECT_ID-orion-vos'
      - '--allow-unauthenticated'
